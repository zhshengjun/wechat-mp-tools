name: Build container images

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *' # 03:17 Asia/Shanghai
  push:
    paths:
      - .github/workflows/image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: wechat-mp-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: lite
            dockerfile: deploy/docker/Dockerfile
            tag: latest
          - variant: full
            dockerfile: deploy/docker/Dockerfile.full
            tag: full
    steps:
      - name: Check out upstream
        uses: actions/checkout@v4
        with:
          repository: x554960766/wechat-mp-tools
          ref: main
          persist-credentials: false
      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.variant }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ matrix.tag }}
            ${{ steps.meta.outputs.image }}:${{ matrix.variant }}-${{ steps.meta.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.description=Container build of x554960766/wechat-mp-tools (${{ matrix.variant }})
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
